# Configuration Jekyll pour L'intégrité physiologique : un droit fondamental

title: "L'intégrité physiologique : un droit fondamental"
description: "Un cadre juridique et éthique pour la reconnaissance du droit à l'intégrité physiologique (DIP) — l'ensemble des droits physiologiques qui protègent le fonctionnement vivant du corps humain."
baseurl: "/droit-integrite-physiologique"
url: "https://periggouanvic.github.io"

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Collections
collections:
  definitions:
    output: true
    permalink: /:collection/:name/
  critique:
    output: true
    permalink: /:collection/:name/
  rapports:
    output: true
    permalink: /:collection/:name/
  editoriaux:
    output: true
    permalink: /:collection/:name/
  droits:
    output: true
    permalink: /:collection/:name/
  ressources:
    output: true
    permalink: /:collection/:name/
  apropos:
    output: true
    permalink: /a-propos/:name/
  mentions:
    output: true
    permalink: /:collection/:name/

# Plugins
plugins:
  - jekyll-sitemap

# Exclusions
exclude:
  - build-site.sh
  - TODO.md
  - GIT_SETUP.md
  - INSTRUCTIONS.md
  - README.md
  - site/
  - Gemfile
  - Gemfile.lock
  - sitemap.xml
